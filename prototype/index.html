<title>TripView Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a transit-line backdrop; centre = phone, left = disruption scenarios, right = screen index, a train rides a 7-stop rail as the trip progresses. */
:root{
  --bg:#E7E2DB; --panel:#F5F2EC; --ink:#241C17; --mute:#7A6E64; --line:#CFC7BC;
  --accent:#F47B20; --accent-ink:#2A1608; --warn:#E8A33A; --ok:#3E8E6A;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --shadow:0 30px 60px -20px rgba(36,28,23,.35);
  --pw:min(86vw,360px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120F;--panel:#211A16;--ink:#F3EBE2;--mute:#9A8D81;--line:#3A2F28;--shadow:0 30px 70px -20px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120F;--panel:#211A16;--ink:#F3EBE2;--mute:#9A8D81;--line:#3A2F28;--shadow:0 30px 70px -20px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:14px;line-height:1.45;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;overflow-x:hidden;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ambient backdrop */
.bgsvg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bgsvg .ln{fill:none;stroke:var(--line);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.bgsvg .fl{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:1 16;opacity:.45;animation:flow 14s linear infinite}
.bgsvg .nd{fill:var(--bg);stroke:var(--accent);stroke-width:4}
.bgsvg .rg{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rg 3.6s ease-out infinite}
.bgsvg .tr{fill:var(--accent);offset-rotate:0deg;animation:ride 22s linear infinite;filter:drop-shadow(0 0 8px var(--accent))}
.bgsvg .tr.b{animation-duration:30s;animation-delay:-11s}
@keyframes flow{to{stroke-dashoffset:-170}}
@keyframes rg{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
@keyframes ride{from{offset-distance:0%}to{offset-distance:100%}}

.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;animation:markin .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes markin{from{transform:scale(.3) rotate(-30deg)}to{transform:none}}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.04em}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;transition:transform .2s,border-color .2s,background .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--accent)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip kbd{font-family:var(--f-mono);font-size:10px;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.explored{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.explored i{display:block;width:84px;height:5px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.explored i::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .7s cubic-bezier(.3,1.3,.5,1)}

/* rail */
.rail{position:relative;margin:4px 0 0;padding:0 34px}
.track{position:relative;height:56px}
.track::before{content:"";position:absolute;left:0;right:0;top:19px;height:6px;border-radius:9px;background:var(--line)}
.fill{position:absolute;left:0;top:19px;height:6px;border-radius:9px;background:var(--accent);width:0;transition:width .95s cubic-bezier(.4,0,.2,1)}
.st{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:70px;border:0;background:none;padding:0}
.st .dot{width:16px;height:16px;border-radius:50%;background:var(--bg);border:4px solid var(--line);margin-top:14px;transition:border-color .4s,background .4s}
.st.done .dot{border-color:var(--accent)}
.st.pop .dot{animation:pop .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.9)}100%{transform:scale(1)}}
.st em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--mute);white-space:nowrap;transition:color .3s,transform .3s}
.st.on em{color:var(--ink);transform:translateY(1px) scale(1.08)}
.train{position:absolute;top:2px;left:0;width:40px;height:40px;margin-left:-20px;z-index:3;transition:left .95s cubic-bezier(.34,1.35,.5,1);pointer-events:none}
.train svg{display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.train .lt{animation:lt 1.2s ease-in-out infinite}
.train.mv::before{content:"";position:absolute;right:30px;top:15px;width:70px;height:10px;border-radius:9px;background:linear-gradient(90deg,transparent,var(--accent));opacity:.0;animation:streak .95s ease-out}
@keyframes streak{0%{opacity:.8;transform:scaleX(.2);transform-origin:right}60%{opacity:.6;transform:scaleX(1)}100%{opacity:0}}
@keyframes lt{50%{opacity:.35}}

/* stage grid */
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;justify-items:center;align-items:start}
.col{width:100%;min-width:0;display:flex;flex-direction:column;gap:12px}
.col h3{margin:0;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media (min-width:1040px){
  :root{--pw:clamp(250px,calc((100vh - 230px) * .462),380px)}
  .stage{grid-template-columns:minmax(230px,1fr) auto minmax(230px,1fr);gap:34px}
  .col.l{order:1;padding-top:30px}.center{order:2}.col.r{order:3;padding-top:30px}
}

/* phone */
.center{display:flex;flex-direction:column;align-items:center;gap:12px;perspective:1400px}
.phone{position:relative;width:var(--pw);aspect-ratio:1170/2532;background:#0d0a08;border-radius:calc(var(--pw)*.16);padding:calc(var(--pw)*.026);box-shadow:var(--shadow),inset 0 0 0 2px #3a322c;transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform}
.phone::before,.phone::after{content:"";position:absolute;width:3px;background:#2a231e;border-radius:3px;left:-3px}
.phone::before{top:17%;height:6%}.phone::after{top:26%;height:10%}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--pw)*.135);overflow:hidden;background:#FAF6F0;container-type:inline-size;isolation:isolate;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.layers,.layer{position:absolute;inset:0}
.layer{will-change:transform,opacity}
.layer img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.island{position:absolute;top:1.3%;left:50%;width:27%;height:3.1%;border-radius:99px;background:#000;transform:translateX(-50%);z-index:30}
.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:40;background:radial-gradient(circle at var(--gx,30%) var(--gy,10%),rgba(255,255,255,.22),transparent 45%);opacity:0;transition:opacity .3s;mix-blend-mode:soft-light}
.phone:hover .glare{opacity:1}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fx svg{position:absolute;inset:0;width:100%;height:100%}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.ring{position:absolute;border:.7cqw solid var(--accent);border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:radar 3.2s ease-out infinite}
@keyframes radar{0%{transform:translate(-50%,-50%) scale(.15);opacity:.9}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.ring.ok{border-color:#FFB070;animation-duration:2.4s}
.clock{position:absolute;left:14%;top:2.25%;transform:translate(-50%,-50%);z-index:31;font-weight:600;font-size:4.3cqw;letter-spacing:-.01em;height:1.3em;overflow:hidden;color:#1d1814;font-variant-numeric:tabular-nums;pointer-events:none;transition:color .4s}
.clock.dk{color:#fff}
.clock span{display:block;line-height:1.3em}
.hot{position:absolute;inset:0;z-index:20}
.hs{position:absolute;border:0;background:transparent;border-radius:3cqw;padding:0;-webkit-tap-highlight-color:transparent}
.show-hot .hs{outline:2px dashed var(--accent);background:rgba(244,123,32,.18);animation:hsin .5s ease both}
.show-hot .hs::after{content:attr(data-l);position:absolute;left:4px;top:-1px;transform:translateY(-100%);font:500 2.9cqw var(--f-mono);background:var(--accent);color:#1d0e04;border-radius:4px;padding:0 1.2cqw;white-space:nowrap}
.hs.tab::after{display:none}
@keyframes hsin{from{opacity:0;transform:scale(.9)}}
.touch{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.rp{position:absolute;width:16cqw;height:16cqw;margin:-8cqw 0 0 -8cqw;border-radius:50%;border:.8cqw solid var(--accent);background:rgba(244,123,32,.28);animation:rp .6s ease-out forwards}
.rp.miss{border-color:#8d8d8d;background:rgba(150,150,150,.2);border-style:dotted}
@keyframes rp{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.ghost{position:absolute;width:11cqw;height:11cqw;margin:-5.5cqw 0 0 -5.5cqw;border-radius:50%;background:rgba(255,255,255,.55);border:.6cqw solid var(--accent);box-shadow:0 .8cqw 3cqw rgba(0,0,0,.35);opacity:0;transition:left 1s cubic-bezier(.5,0,.2,1),top 1s cubic-bezier(.5,0,.2,1),opacity .4s}
.ghost.on{opacity:1}
.ghost::after{content:"";position:absolute;inset:-.6cqw;border-radius:50%;border:.7cqw solid var(--accent);animation:gh 1.1s ease-out infinite;animation-delay:1s}
@keyframes gh{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.flash{position:absolute;inset:0;z-index:28;pointer-events:none;background:radial-gradient(circle,rgba(255,180,60,.0) 30%,rgba(255,170,40,.75));opacity:0}
.banner{position:absolute;left:4%;right:4%;top:2%;z-index:35;display:flex;gap:3cqw;align-items:flex-start;padding:3.4cqw;border-radius:6cqw;background:rgba(250,247,242,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 3cqw 8cqw rgba(0,0,0,.35);color:#1d1814;border:0;text-align:left;transform:translateY(-140%);width:92%;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.banner.on{transform:none}
.banner .ic{flex:none;width:9cqw;height:9cqw;border-radius:2.4cqw;background:var(--accent);display:grid;place-items:center}
.banner .ic svg{width:60%;height:60%}
.banner small{font:500 2.8cqw var(--f-mono);color:#7a6e64;display:flex;justify-content:space-between;letter-spacing:.04em}
.banner b{display:block;font-size:3.9cqw;line-height:1.2;margin-top:.5cqw}
.banner p{margin:.5cqw 0 0;font-size:3.4cqw;line-height:1.3;color:#43382f}
.cap{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--mute);min-height:20px}
.cap b{color:var(--ink);font-weight:500;display:inline-block}
.cap .n{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px;font-weight:500}
.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate3d(-2px,0,0) rotate(-.4deg)}20%,80%{transform:translate3d(4px,0,0) rotate(.6deg)}30%,50%,70%{transform:translate3d(-7px,0,0) rotate(-1deg)}40%,60%{transform:translate3d(7px,0,0) rotate(1deg)}}

/* side panels */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.sc{display:flex;flex-direction:column;gap:8px}
.scb{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.scb:hover{transform:translateX(5px);border-color:var(--accent);box-shadow:-4px 0 0 var(--accent)}
.scb:active{transform:scale(.97)}
.scb .gi{flex:none;width:32px;height:32px;border-radius:9px;background:var(--panel);display:grid;place-items:center;border:1px solid var(--line);color:var(--accent)}
.scb:hover .gi svg{animation:wig .6s ease}
@keyframes wig{20%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}80%{transform:rotate(-6deg)}}
.scb b{display:block;font-size:13.5px;line-height:1.2}
.scb span{font-size:12px;color:var(--mute);line-height:1.3;display:block}
.notes{display:flex;flex-direction:column;gap:8px;min-height:150px}
.notes .nt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.notes h4{margin:0;font-size:16px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.notes p{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.notes .ev{font-size:12px;line-height:1.45;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.ctl{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.ctl kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:4px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.th{position:relative;border:2px solid transparent;border-radius:9px;background:var(--panel);padding:0;overflow:hidden;aspect-ratio:1170/2532;transition:transform .25s cubic-bezier(.3,1.7,.5,1),border-color .25s,filter .25s;filter:grayscale(.9) opacity(.6)}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.th.v{filter:none;border-color:var(--line)}
.th:hover{transform:translateY(-5px) scale(1.12);z-index:2;filter:none;border-color:var(--accent)}
.th.c{border-color:var(--accent);transform:scale(1.1);z-index:1;filter:none;box-shadow:0 0 0 3px rgba(244,123,32,.3),0 8px 18px rgba(0,0,0,.3)}
.th i{position:absolute;left:3px;bottom:3px;font:500 9px var(--f-mono);font-style:normal;background:rgba(20,14,10,.78);color:#fff;border-radius:4px;padding:0 4px}
.fade-up{animation:fu .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes fu{from{opacity:.2;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.bgsvg{display:none}}
@media (max-width:560px){.st em{font-size:0}.st.on em{font-size:11px}.rail{padding:0 24px}.explored i{width:56px}}
</style>

<svg class="bgsvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path id="bl1" class="ln" d="M-40 700 H380 L520 560 H980 L1120 700 H1640"/>
  <path class="fl" d="M-40 700 H380 L520 560 H980 L1120 700 H1640"/>
  <path id="bl2" class="ln" d="M-40 190 H260 L420 350 H760 L900 210 H1640"/>
  <path class="fl" d="M-40 190 H260 L420 350 H760 L900 210 H1640" style="animation-duration:19s"/>
  <circle class="nd" cx="520" cy="560" r="14"/><circle class="rg" cx="520" cy="560" r="14"/>
  <circle class="nd" cx="1120" cy="700" r="14"/><circle class="rg" cx="1120" cy="700" r="14" style="animation-delay:1.4s"/>
  <circle class="nd" cx="420" cy="350" r="14"/><circle class="rg" cx="420" cy="350" r="14" style="animation-delay:.7s"/>
  <circle class="nd" cx="900" cy="210" r="14"/><circle class="rg" cx="900" cy="210" r="14" style="animation-delay:2.1s"/>
  <circle class="tr" r="7" style="offset-path:path('M-40 700 H380 L520 560 H980 L1120 700 H1640')"/>
  <circle class="tr b" r="7" style="offset-path:path('M-40 190 H260 L420 350 H760 L900 210 H1640')"/>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6" fill="#2A1608"/><circle cx="15" cy="14" r=".6" fill="#2A1608"/></svg></div>
      <div><b>Transfer Coach</b><span>INTERACTIVE PROTOTYPE · DEMO DATA</span></div>
    </div>
    <div class="acts">
      <div class="explored" id="explored"><span id="expTxt">1 / 38 screens</span><i></i></div>
      <button class="chip" id="hotBtn" aria-pressed="false">Show hotspots <kbd>H</kbd></button>
      <button class="chip" id="rstBtn">Restart <kbd>R</kbd></button>
    </div>
  </header>

  <nav class="rail" aria-label="Trip progress"><div class="track" id="track"></div></nav>

  <main class="stage">
    <aside class="col l">
      <h3>Design notes</h3>
      <div class="notes card" id="notes" aria-live="polite"></div>
      <h3>Test a disruption</h3>
      <div class="sc card" id="scen"></div>
      <ul class="ctl" aria-label="Keyboard shortcuts">
        <li><kbd>&larr;</kbd>Back</li><li><kbd>Enter</kbd>Next</li><li><kbd>H</kbd>Hotspots</li><li><kbd>R</kbd>Restart</li>
      </ul>
    </aside>

    <section class="center">
      <div class="phone" id="phone">
        <div class="screen" id="screen">
          <div class="layers" id="layers"></div>
          <div class="fx" id="fx"></div>
          <div class="flash" id="flash"></div>
          <div class="island"></div>
          <div class="clock" id="clock"><span>9:30</span></div>
          <div class="hot" id="hot"></div>
          <div class="touch" id="touch"><div class="ghost" id="ghost"></div></div>
          <button class="banner" id="banner" aria-live="polite"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2A1608" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/></svg></div><div><small><span>TRIPVIEW</span><span>now</span></small><b id="bT"></b><p id="bP"></p></div></button>
          <div class="glare"></div>
        </div>
      </div>
      <div class="cap" id="cap"></div>
    </section>

    <aside class="col r">
      <h3>All screens</h3>
      <div class="grid" id="grid"></div>
    </aside>
  </main>

const NOTES={
'01':['Framing','A decision layer for the minutes of a transfer','The feature answers three in-transit questions: can I still make it, where do I walk, and what do I do if I cannot.','Source: client brief'],
'02':['Planning','Arrive-by is a first-class input','Origin, destination and arrive-by time sit together, with preference chips below.','Evidence: a usability participant wanted to tell the app "by 10:30" and could not.'],
'03':['Planning','Routes lead with arrival time','The large number is when you arrive at the venue, followed by minutes of transfer and the number of changes.','Evidence: participants compared every option with their deadline in their heads.'],
'04':['Planning','Preferences include Fastest','Balanced, Fastest and Step-free are offered as one choice, not hidden settings.','Evidence: one participant wanted the fastest route and could only pick Balanced, Fewer transfers or Less walking.'],
'05':['Planning','Mode filters set constraints early','Commuters can narrow the plan to rail only, road only, or avoid ferries before they leave.','Source: client brief, route preferences'],
'06':['Trip overview','The whole trip as stages','Walk, train, transfer and bus are listed with times, and arrival is shown against the 10:30 start.','Evidence: a journal participant said the staged overview made the whole trip easy to picture.'],
'07':['Alerts','Alerts explain impact, not just status','Each alert carries a state (late, tight transfer) and opens the affected leg of the trip.','Evidence: a separate alerts tab forced extra checking in the experience journals.'],
'08':['Walking','One instruction at a time','A highlighted route, a walking time and a single instruction card keep the screen readable while moving.','Principle: scan while walking.'],
'09':['Station guidance','Plain words instead of level codes','"Head downstairs" and an isometric station section replace technical wording.','Evidence: "Level +1" was called engineer-y by two participants.'],
'10':['Waiting','Two clocks, kept apart','Departure countdown with an on-time label above, destination arrival and minutes before the event below.','Brief requirement: separate "can I catch it" from "will I arrive on time".'],
'11':['On board','Stop list shows what is next','Boarded, next stop and get-off stop are marked; arrival time stays on screen.','Evidence: participants were unsure which stage of the trip they were in.'],
'12':['Delay','Old time struck through, new time shown','The delay, the new departure and the effect on arrival are in one view.','Evidence: the most severe usability finding was an app that contradicted the stop display.'],
'13':['Recovery','Next move, ranked by arrival','Each option shows arrival time first, then walk or wait, and minutes before the event.','Evidence: backup routes were hard to compare when arrival time was small grey text.'],
'14':['Recovery','Same platform, next train','Offers the lowest-effort option first and says how long the wait is.','Principle: reduce the cost of recovery.'],
'15':['Recovery','Bus or train?','Two options side by side with the arrival difference stated in words.','Evidence: users hesitated when option cards looked unequal and untappable.'],
'16':['Recovery','Direct route guidance','Choosing a route leads straight into guidance to the stand.','Evidence: after choosing a new route, participants had no way to start guidance.'],
'17':['Waiting','Countdown at the stand','Departure countdown, stand letter and arrival at the venue in a single card.','Principle: one glance.'],
'18':['Wrong-stop recovery','You passed your stop','The screen names where you are, the way back and the return stop.','Evidence: added after reviews found no recovery path for a wrong stop.'],
'19':['Wrong-stop recovery','Catch the return train','Countdown and platform number first, then the direction of travel.','Principle: next action first.'],
'20':['Wrong-stop recovery','Back on track','Confirms the one-stop ride back and shows the new arrival time.','Principle: reassurance after error.'],
'21':['Transfer','Three numbers, one decision','Bus departs in 6 min, walk takes 3 min, 3 min to spare. Arrival 10:20 is shown separately as 10 min before the event.','Brief requirement: separate catching the next service from arriving on time.'],
'22':['Station guidance','Landmark-led route','A station section with the path from platform to stand, and a "Fix my position" entry.','Evidence: "Indoor position is approximate" made participants nervous.'],
'23':['Station guidance','Confirm position by landmark','Pick the sign or feature you can see, without relying on GPS indoors.','Evidence: indoor GPS was often wrong in research interviews.'],
'24':['Station guidance','Two ways out, with times','Exit 1 by stairs and escalator and Exit 2 by lift, each with walking time.','Evidence: a journal participant was unsure about the lift option because no time was shown.'],
'25':['Station guidance','Step 1 of 3','One action, a pictogram, a short sentence and the time left.','Evidence: participants praised step-by-step directions with real landmarks.'],
'26':['Station guidance','Step-free alternative','The lift path keeps the same structure so the choice does not change the pattern.','Principle: consistent patterns.'],
'27':['Station guidance','Turn right after the ticket gates','A single bold arrow and the exit sign to look for.','Principle: pictograms over text.'],
'28':['Station guidance','Cross to the stand','The crossing and the final distance, 40 m, with the stand sign to match.','Principle: tell people what to look for.'],
'29':['Arrival at stand','You are at Stand C','Says where you are and what to wait for. It does not claim the transfer is complete.','Evidence: "Transfer complete" before boarding was flagged in every test scenario.'],
'30':['Waiting','Countdown and an escape hatch','A countdown ring with the departure time, and "I missed it" as a manual fallback.','Evidence: recommendation to keep manual fallbacks for live data gaps.'],
'31':['Delay','The delayed state','New departure 10:10 with the old time struck through, +8 min, and arrival with the delay already included.','Evidence: the most severe usability finding. The app said 2 min while the stop display said 8 min late.'],
'32':['Recovery','Pick your next move','Bus 410 arrives earlier but needs a walk; Bus 343 is the same stand. Each shows minutes before the event.','Evidence: users doubted a recommended route that was not the fastest.'],
'33':['Waiting','Stay at the stand','Keeps the original option visible with its new time and the arrival it leads to.','Principle: no dead ends.'],
'34':['On board','Get off at Lakeside','Next stop is highlighted, with the walk to the venue and arrival time below.','Evidence: stage of the trip was unclear during the bus leg.'],
'35':['Arrival','Confirmed only after arrival','The success state appears at the end of the trip, not at the stand.','Evidence: a participant at the end asked "have I already done it?"'],
'36':['Recovery','Stay or switch','Two cards with next bus, wait and arrival so the comparison takes one glance.','Brief requirement: compare waiting with switching to Stand D.'],
'37':['Recovery','Walk to the new stand','Map, walking time and one landmark: the taxi bay.','Principle: guidance starts as soon as the route changes.'],
'38':['Recovery','Stand D, Bus 410','Stand letter, route number, departure and arrival at the venue.','Principle: confirm the details that identify the vehicle.']

 '<div class="train" id="train"><svg width="40" height="40" viewBox="0 0 40 40"><rect x="5" y="3" width="30" height="31" rx="9" fill="#F47B20"/><rect x="10" y="8" width="20" height="11" rx="3.5" fill="#2A1608"/><circle class="lt" cx="13" cy="26" r="2.6" fill="#FFE9CC"/><circle class="lt" cx="27" cy="26" r="2.6" fill="#FFE9CC"/><path d="M12 34l-3 4M28 34l3 4" stroke="#2A1608" stroke-width="2.4" stroke-linecap="round"/></svg></div>';
const stEls=[...track.querySelectorAll('.st')],trainEl=$('#train'),fillEl=$('#fill');
function setStage(s){
  if(s===stage&&trainEl.dataset.init)return;
  trainEl.dataset.init=1;
  const prev=stage;stage=s;
  const pct=s/6*100;
  trainEl.style.left=pct+'%';fillEl.style.width=pct+'%';
  trainEl.classList.remove('mv');void trainEl.offsetWidth;if(s!==prev)trainEl.classList.add('mv');
  stEls.forEach((e,i)=>{e.classList.toggle('done',i<=s);e.classList.toggle('on',i===s);
    if(i===s&&s!==prev){e.classList.remove('pop');void e.offsetWidth;setTimeout(()=>e.classList.add('pop'),i>prev?700:0)}});
}

// ---------- clock (rolling digits) ----------
function setClock(t){
  if(!t||t===timeNow)return;
  const old=clock.firstElementChild,nw=document.createElement('span');nw.textContent=t;
  const fwd=toMin(t)>=toMin(timeNow);timeNow=t;
  clock.appendChild(nw);
  const h=clock.clientHeight;
  if(RM){old.remove();return}
  old.animate([{transform:'translateY(0)'},{transform:`translateY(${fwd?-h:h}px)`}],{duration:520,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
  nw.animate([{transform:`translateY(${fwd?h:-h}px)`},{transform:'translateY(0)'}],{duration:520,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>old.remove();
  nw.style.marginTop=-h+'px';
}
const toMin=t=>{const[a,b]=t.split(':');return (+a)*60+(+b)};

// ---------- hotspots ----------
function box(x,y,w,h,cls,label,fn,lab){
  const b=document.createElement('button');b.className='hs '+(cls||'');
  b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
  b.setAttribute('aria-label',label);b.dataset.l=lab||label;
  b.addEventListener('click',e=>{e.stopPropagation();ripple(e);fn(e)});
  hot.appendChild(b);return b;
}
function buildHot(id){
  hot.innerHTML='';const d=T[id]||{};
  if(!NOBAR.has(id)){
    const tabs=[['02','Plan tab'],['06','Your trip tab'],['07','Alerts tab']];
    tabs.forEach(([to,l],i)=>box(i*33.34,92.6,33.34,7.4,'tab',l,e=>{if(to!==cur)go(to,'fade',{push:true})},to));
    box(2,3.9,13,6.4,'back','Back',()=>back(),'←');
  }
  (d.spots||[]).forEach(s=>box(s[0],s[1],s[2],s[3],'',s[5],e=>go(s[4],s[6],{push:true,e}),s[4]));
  if(d.alt){const y=d.altY||YA;box(25,y-2.3,50,4.6,'',d.alt.label,e=>go(d.alt.to,d.alt.mode,{push:true,e}),d.alt.to)}
  if(d.cta){box(4,d.cta.y-3.4,92,6.8,'cta','Primary action',e=>go(d.cta.to,d.cta.mode,{push:true,e}),d.cta.l)}
}
function ripple(e,miss){
  const r=screenEl.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width*100),y=((e.clientY-r.top)/r.height*100);
  const s=document.createElement('span');s.className='rp'+(miss?' miss':'');s.style.left=x+'%';s.style.top=y+'%';
  touch.appendChild(s);setTimeout(()=>s.remove(),650);
  idleReset();
}
screenEl.addEventListener('click',e=>{ if(e.target.closest('.hs')||e.target.closest('.banner'))return; ripple(e,true)});

// ---------- fx ----------
function stopFx(){fx.innerHTML='';if(confetti){cancelAnimationFrame(confetti);confetti=null}}
function startFx(id){
  stopFx();if(RM)return;
  if(id==='01'){[0,1.05,2.1].forEach(dl=>{const r=document.createElement('div');r.className='ring';r.style.cssText=`left:52%;top:58.5%;width:62cqw;height:62cqw;animation-delay:${dl}s`;fx.appendChild(r)})}
  if(id==='30'){[0,1.2].forEach(dl=>{const r=document.createElement('div');r.className='ring';r.style.cssText=`left:50%;top:38.6%;width:60cqw;height:60cqw;animation-delay:${dl}s;animation-duration:2.4s;border-width:.5cqw;opacity:0`;fx.appendChild(r)})}
  if(PATHS[id]){
    const p=PATHS[id],k=216.41,d=p.map((q,i)=>(i?'L':'M')+q[0]+' '+(q[1]*k/100).toFixed(2)).join(' ');
    fx.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 100 ${k}" preserveAspectRatio="none"><defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".9"/></filter></defs>
      <path d="${d}" pathLength="100" fill="none" stroke="#FFD9A8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" stroke-dasharray="12 100" opacity=".85"><animate attributeName="stroke-dashoffset" values="12;-100" dur="2.6s" repeatCount="indefinite" keySplines=".5 0 .5 1" calcMode="spline" keyTimes="0;1"/></path>
      <path d="${d}" pathLength="100" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 100"><animate attributeName="stroke-dashoffset" values="6;-100" dur="2.6s" repeatCount="indefinite" keySplines=".5 0 .5 1" calcMode="spline" keyTimes="0;1"/></path></svg>`);
  }
  if(id==='35'){[0,.8,1.6].forEach(dl=>{const r=document.createElement('div');r.className='ring ok';r.style.cssText=`left:50%;top:26.6%;width:70cqw;height:70cqw;animation-delay:${dl}s`;fx.appendChild(r)});setTimeout(()=>burst(),650)}
}
function burst(){
  const cv=document.createElement('canvas');const W=screenEl.clientWidth,H=screenEl.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  cv.width=W*dpr;cv.height=H*dpr;fx.appendChild(cv);const c=cv.getContext('2d');c.scale(dpr,dpr);
  const cols=['#F47B20','#FFB070','#FAF6F0','#FFD9A8','#C75A0E','#fff'];
  const ps=Array.from({length:90},()=>{const a=Math.random()*Math.PI*2,v=3+Math.random()*9;return{x:W*.5,y:H*.266,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:4+Math.random()*7,h:3+Math.random()*3,c:cols[Math.random()*cols.length|0],s:Math.random()<.3?1:0,life:1}});
  let t0=performance.now();
  (function f(t){const dt=Math.min(2,(t-t0)/16.7);t0=t;c.clearRect(0,0,W,H);let alive=0;
    ps.forEach(p=>{p.vy+=.22*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.life-=.0055*dt;if(p.life<=0)return;alive++;
      c.save();c.globalAlpha=Math.min(1,p.life*1.6);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;
      if(p.s){c.beginPath();c.arc(0,0,p.h,0,7);c.fill()}else c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
    if(alive&&cv.isConnected)confetti=requestAnimationFrame(f);else{cv.remove();confetti=null}})(t0);
}

// ---------- navigation ----------
function finish(){if(busy){busy();busy=null}}
function go(to,mode='fade',o={}){
  finish();hideBanner();
  if(to===cur)return;
  mode=RM?'fade':mode;
  const from=cur;
  if(o.push&&from)hist.push(from);
  const el=document.createElement('div');el.className='layer';
  el.innerHTML=`<img src="screens/${to}.webp" alt="TripView screen ${to}: ${NAMES[to]}" draggable="false">`;
  const old=layers.lastElementChild;
  let ox=50,oy=50;
  if(o.e&&o.e.clientX!=null){const r=screenEl.getBoundingClientRect();ox=(o.e.clientX-r.left)/r.width*100;oy=(o.e.clientY-r.top)/r.height*100}
  if(mode==='arrive'){ox=50;oy=26.6}
  const anims=[];
  const A=(e,k,opt)=>{const a=e.animate(k,opt);anims.push(a);return a};
  const E='cubic-bezier(.22,1,.36,1)';
  if(!old||mode==='init'){layers.appendChild(el);if(!RM&&old!==undefined&&!old){A(el,[{opacity:0,transform:'scale(1.06)',filter:'blur(8px)'},{opacity:1,transform:'none',filter:'none'}],{duration:800,easing:E})}}
  else if(mode==='push'){
    el.style.boxShadow='-3cqw 0 8cqw rgba(0,0,0,.28)';layers.appendChild(el);
    A(el,[{transform:'translateX(100%)'},{transform:'none'}],{duration:560,easing:E});
    A(old,[{transform:'none',filter:'brightness(1)'},{transform:'translateX(-26%)',filter:'brightness(.65)'}],{duration:560,easing:E,fill:'forwards'});
  }else if(mode==='pop'){
    el.style.zIndex=0;old.style.zIndex=2;old.style.boxShadow='-3cqw 0 8cqw rgba(0,0,0,.28)';layers.insertBefore(el,old);
    A(el,[{transform:'translateX(-26%)',filter:'brightness(.65)'},{transform:'none',filter:'brightness(1)'}],{duration:520,easing:E});
    A(old,[{transform:'none'},{transform:'translateX(100%)'}],{duration:520,easing:E,fill:'forwards'});
  }else if(mode==='rise'){
    el.style.borderRadius='6cqw 6cqw 0 0';layers.appendChild(el);
    A(el,[{transform:'translateY(100%)'},{transform:'translateY(-1.5%)',offset:.82},{transform:'none'}],{duration:620,easing:'cubic-bezier(.3,.9,.3,1)'});
    A(old,[{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(.94)',filter:'brightness(.55)'}],{duration:620,easing:E,fill:'forwards'});
  }else if(mode==='iris'||mode==='arrive'){
    layers.appendChild(el);
    A(el,[{clipPath:`circle(0% at ${ox}% ${oy}%)`},{clipPath:`circle(150% at ${ox}% ${oy}%)`}],{duration:mode==='arrive'?1000:720,easing:'cubic-bezier(.65,0,.25,1)'});
    A(old,[{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(1.06)',filter:'brightness(.7)'}],{duration:720,easing:E,fill:'forwards'});
  }else if(mode==='alert'){
    layers.appendChild(el);
    A(el,[{opacity:0,filter:'blur(10px) saturate(1.6)',transform:'scale(1.04)'},{opacity:1,filter:'none',transform:'none'}],{duration:620,easing:E});
    A(old,[{filter:'none'},{filter:'sepia(1) saturate(3) brightness(1.1)',offset:.25},{filter:'sepia(1) saturate(3) brightness(.7)'}],{duration:520,fill:'forwards'});
    flash.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:800,easing:'ease-out'});
    phone.classList.remove('shake');void phone.offsetWidth;phone.classList.add('shake');
  }else if(mode==='rewind'){
    layers.appendChild(el);
    A(el,[{opacity:0,transform:'scale(.86) rotate(-3deg)'},{opacity:1,transform:'none'}],{duration:800,easing:E});
    A(old,[{opacity:1,transform:'none'},{opacity:0,transform:'scale(1.3)'}],{duration:800,easing:E,fill:'forwards'});
  }else{ // fade
    layers.appendChild(el);
    A(el,[{opacity:0,transform:'scale(1.035)'},{opacity:1,transform:'none'}],{duration:340,easing:'ease-out'});
  }
  cur=to;visited.add(to);
  const clean=()=>{[...layers.children].forEach(c=>{if(c!==el)c.remove()});el.style.cssText='';anims.forEach(a=>{try{a.cancel()}catch(_){}});busy=null};
  if(anims.length){const last=anims.reduce((a,b)=>b.effect.getTiming().duration>a.effect.getTiming().duration?b:a);
    busy=()=>{clean()};last.finished.then(()=>{if(cur===to&&busy)clean()}).catch(()=>{})}
  else clean();
  afterGo(to,from);
}
function afterGo(id,from){
  buildHot(id);startFx(id);
  clock.classList.toggle('dk',DARK.has(id));
  setClock(TIME[id]);
  if(id!=='07')setStage(STG[id]);
  stEls.forEach(e=>e.style.pointerEvents='none');
  $('#cap').innerHTML=`<span class="n">${id}</span><b>${NAMES[id]}</b>`;
  $('#cap b').animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350,easing:'ease-out'});
  const nt=NOTES[id];if(nt){const n=$('#notes');n.innerHTML=`<span class="nt">${nt[0]}</span><h4>${nt[1]}</h4><p>${nt[2]}</p><div class="ev">${nt[3]}</div>`;
    if(!RM)n.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:380,easing:'ease-out'})}
  document.querySelectorAll('.th').forEach(t=>{t.classList.toggle('c',t.dataset.id===id);if(t.dataset.id===id)t.classList.add('v')});
  $('#expTxt').textContent=visited.size+' / 38 screens';$('#explored').style.setProperty('--p',visited.size/38);
  try{if(location.hash!=='#screen-'+id)history.replaceState(null,'','#screen-'+id)}catch(_){}
  idleReset();
}
function back(){
  let to=hist.pop();
  if(!to)to=BACKTO[cur];
  if(to)go(to,'pop');else{phone.classList.remove('shake');void phone.offsetWidth;phone.classList.add('shake')}
}
function restart(){hist=[];go('01','rewind')}

// ---------- idle ghost finger ----------
function idleReset(){
  clearTimeout(idleT);ghost.classList.remove('on');
  idleT=setTimeout(showGhost,4200);
}
function showGhost(){
  if(RM)return;const d=T[cur]||{};const c=d.cta||(d.spots&&{y:d.spots[0][1]+d.spots[0][3]/2});if(!c)return;
  const y=d.cta?d.cta.y:c.y,x=d.cta?50:50;
  ghost.style.transition='none';ghost.style.left='78%';ghost.style.top='99%';void ghost.offsetWidth;
  ghost.style.transition='';ghost.classList.add('on');ghost.style.left=x+'%';ghost.style.top=y+'%';
}

// ---------- banner / scenarios ----------
function hideBanner(){clearTimeout(bannerT);banner.classList.remove('on')}
function runScenario(s){
  finish();hideBanner();
  $('#bT').textContent=s.bt;$('#bP').textContent=s.bp;
  phone.classList.remove('shake');void phone.offsetWidth;phone.classList.add('shake');
  banner.classList.add('on');
  banner.onclick=()=>{go(s.to,'alert',{push:true});};
  bannerT=setTimeout(()=>{go(s.to,'alert',{push:true});bannerT=setTimeout(hideBanner,1400)},1500);
  idleReset();
}
$('#scen').innerHTML=SCEN.map((s,i)=>`<button class="scb" data-i="${i}"><span class="gi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.ic]}</svg></span><span><b>${s.t}</b><span>${s.d}</span></span></button>`).join('');
$('#scen').addEventListener('click',e=>{const b=e.target.closest('.scb');if(b)runScenario(SCEN[+b.dataset.i])});

// ---------- grid ----------
$('#grid').innerHTML=IDS.map((id,i)=>`<button class="th fade-up" style="animation-delay:${i*22}ms" data-id="${id}" title="${id} · ${NAMES[id]}" aria-label="Go to screen ${id}, ${NAMES[id]}"><img src="screens/${id}.webp" alt="" loading="lazy"><i>${id}</i></button>`).join('');
$('#grid').addEventListener('click',e=>{const b=e.target.closest('.th');if(b)go(b.dataset.id,'fade',{push:true})});

// ---------- controls ----------
$('#hotBtn').addEventListener('click',()=>{showHot=!showHot;screenEl.classList.toggle('show-hot',showHot);$('#hotBtn').setAttribute('aria-pressed',showHot)});
$('#rstBtn').addEventListener('click',restart);
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='h')$('#hotBtn').click();
  else if(k==='r')restart();
  else if(e.key==='ArrowLeft')back();
  else if((e.key==='Enter'||e.key==='ArrowRight')&&(document.activeElement===document.body)){const c=(T[cur]||{}).cta;if(c){go(c.to,c.mode,{push:true})}}
});
// tilt + glare
if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!RM){
  phone.addEventListener('pointermove',e=>{const r=phone.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    phone.style.transform=`rotateY(${(x-.5)*9}deg) rotateX(${(.5-y)*6}deg)`;phone.style.setProperty('--gx',x*100+'%');phone.style.setProperty('--gy',y*100+'%')});
  phone.addEventListener('pointerleave',()=>{phone.style.transform=''});
}
addEventListener('hashchange',()=>{const m=/^#screen-(\d\d)$/.exec(location.hash);if(m&&T[m[1]]&&m[1]!==cur)go(m[1],'fade')});

// boot
{const m=/^#screen-(\d\d)$/.exec(location.hash);const start=m&&T[m[1]]?m[1]:'01';
 const first=document.createElement('div');first.className='layer';first.innerHTML=`<img src="screens/${start}.webp" alt="TripView screen ${start}">`;layers.appendChild(first);
 first.animate([{opacity:0,transform:'scale(1.08)',filter:'blur(10px)'},{opacity:1,transform:'none',filter:'none'}],{duration:900,easing:'cubic-bezier(.22,1,.36,1)'});
 cur=start;visited.add(start);timeNow='';clock.firstElementChild.textContent=TIME[start];timeNow=TIME[start];
 trainEl.style.transition='none';afterGo(start,null);setTimeout(()=>{trainEl.style.transition=''},60);
}
</script>
